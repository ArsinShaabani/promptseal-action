# Validation & smoke test for the composite action (no provider key needed:
# uses the mock provider against the repo's own example flow).
name: Action sanity
on:
  push:
    branches: [main]
  pull_request:

jobs:
  yaml-valid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: action.yml is valid YAML
        run: |
          pip install pyyaml --quiet
          python -c "import yaml; yaml.safe_load(open('action.yml')); print('action.yml OK')"

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build a mock suite and seal a baseline
        run: |
          pip install "git+https://github.com/ArsinShaabani/promptseal.git" --quiet
          mkdir -p demo && cd demo
          promptseal init
          promptseal seal
          git add -f .promptseal/baseline.json
      - name: Run this action (mock provider, sealed baseline)
        uses: ./
        with:
          working_directory: demo
          comment: 'false'
